<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

    <title>Document</title>
</head>
<script src="script.js"></script>

<link rel="stylesheet" href="style.css">
<body>
<h1> Calculadora da Débora</h1>
<h2>Fique à vontade para tirar as suas dúvidas!</h2><br><br>
<h3>Soma:</h3>
<input type="number" id="numero1" placeholder="1°numero">
<input type="number" id="numero2" placeholder="2°numero">
<button onclick="calcularSoma()">Somar</button><br><hr>
<h3>Subtração:</h3>
<input type="number" id="subtraçao1" placeholder="1°numero">
<input type="number" id="subtraçao2" placeholder="2°numero">
<button onclick="calcularSubtração()">Subtrair</button><br><hr>
<h3>Multiplicação:</h3>
<input type="number" id="multiplicaçao1" placeholder="1°numero">
<input type="number" id="multiplicaçao2" placeholder="2°numero">
<button onclick="calcularMultiplicação()">Multiplicar</button><br><hr>
<h3>Divisão:</h3>
<input type="number" id="divisao1" placeholder="1°numero">
<input type="number" id="divisao2" placeholder="2°numero">
<button onclick="calcularDivisão()">Dividir</button><br><hr>
<h3>Resto da divisão</h3>
<input type="number" id="resto1" placeholder="1°numero">
<input type="number" id="resto2" placeholder="2°numero">
<button onclick="calcularResto()">Verificar</button><br><hr>
